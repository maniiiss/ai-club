# 服务器部署编排文件：面向 192.168.110.23 的一键构建与启动配置。
services:
  postgres:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb-ha:pg16}
    container_name: git-ai-club-server-postgres
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aiclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiclub123}
      HINDSIGHT_POSTGRES_DB: ${HINDSIGHT_POSTGRES_DB:-hindsight}
      HINDSIGHT_API_VECTOR_EXTENSION: ${HINDSIGHT_API_VECTOR_EXTENSION:-pgvectorscale}
      TZ: ${APP_TZ:-Asia/Shanghai}
      PGTZ: ${APP_TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_DIR:-/data/git-ai-club/postgres}:/home/postgres/pgdata"
      # 初始化 Hindsight 专用数据库与 pgvector 扩展；仅在 PGDATA 首次初始化时执行。
      - "./docker/postgres/init:/docker-entrypoint-initdb.d:ro"
      - "./docker/postgres/bin:/opt/git-ai-club/postgres/bin:ro"
    entrypoint:
      - /bin/sh
      - /opt/git-ai-club/postgres/bin/start-postgres-with-auto-pgdata.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aiclub} -d ${POSTGRES_DB:-ai_agent_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-bootstrap:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb-ha:pg16}
    container_name: git-ai-club-server-postgres-bootstrap
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aiclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiclub123}
      HINDSIGHT_POSTGRES_DB: ${HINDSIGHT_POSTGRES_DB:-hindsight}
      HINDSIGHT_API_VECTOR_EXTENSION: ${HINDSIGHT_API_VECTOR_EXTENSION:-pgvectorscale}
      # PostgreSQL 初始化补偿目标由 env 决定；服务器外部库场景不能固定走 Docker 内部服务名。
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Hindsight 数据库密码单独通过 libpq 环境变量传递，避免复杂密码写入 URL 后被解析链路误伤。
      PGPASSWORD: ${POSTGRES_PASSWORD:-aiclub123}
    volumes:
      - "./docker/postgres/init:/docker-entrypoint-initdb.d:ro"
    # 每次启动时都补偿一次独立库和 vector 扩展，兼容已有 PGDATA 不会重跑 initdb 脚本的场景。
    entrypoint:
      - /bin/sh
      - /docker-entrypoint-initdb.d/10-init-hindsight-db.sh

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: git-ai-club-server-redis
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
      else
        redis-server --appendonly yes;
      fi"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "${REDIS_DATA_DIR:-/data/git-ai-club/redis}:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    container_name: git-ai-club-server-rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-aiclub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aiclub123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - "${RABBITMQ_DATA_DIR:-/data/git-ai-club/rabbitmq}:/var/lib/rabbitmq"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-02-28T09-55-16Z}
    container_name: git-ai-club-server-minio
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${PLATFORM_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PLATFORM_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - "${MINIO_DATA_DIR:-/data/git-ai-club/minio}:/data"

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.4}
    container_name: git-ai-club-server-qdrant
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "${QDRANT_PORT:-16333}:6333"
    volumes:
      - "${QDRANT_DATA_DIR:-/data/git-ai-club/qdrant}:/qdrant/storage"

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    container_name: git-ai-club-server-neo4j
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - "${NEO4J_DATA_DIR:-/data/git-ai-club/neo4j}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    container_name: git-ai-club-server-hindsight
    restart: unless-stopped
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-https://api.openai.com/v1}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4o-mini}
      # 外部 LLM 临时限流或欠费时，也要先把 Hindsight 拉起来，保障 recall / 实体图等只读链路可用。
      # 真正需要 LLM 的 retain / reflect / consolidation 请求会在单次调用时再明确报错。
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: ${HINDSIGHT_API_SKIP_LLM_VERIFICATION:-true}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-openai}
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: ${HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL:-BAAI/bge-small-en-v1.5}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL:-http://127.0.0.1:8000/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY:-local}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL:-Qwen/Qwen3-Embedding-4B}
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-rrf}
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: ${HINDSIGHT_API_RERANKER_LOCAL_MODEL:-BAAI/bge-reranker-v2-m3}
      HINDSIGHT_API_RERANKER_LITELLM_API_BASE: ${HINDSIGHT_API_RERANKER_LITELLM_API_BASE:-http://127.0.0.1:4000}
      HINDSIGHT_API_RERANKER_LITELLM_API_KEY: ${HINDSIGHT_API_RERANKER_LITELLM_API_KEY:-}
      HINDSIGHT_API_RERANKER_LITELLM_MODEL: ${HINDSIGHT_API_RERANKER_LITELLM_MODEL:-cohere/rerank-english-v3.0}
      # 兼容包含 @、?、*、% 等特殊字符的复杂密码，默认不再把密码写进 URL，交给 libpq 从 PGPASSWORD 读取。
      # 数据库地址由 POSTGRES_* 变量拼装（支持服务器外部库场景），不再使用 docker-compose 不支持的嵌套变量插值。
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-aiclub}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${HINDSIGHT_POSTGRES_DB:-hindsight}
      # 如果 Hindsight 需要连接独立数据库账号，可单独覆盖 HINDSIGHT_API_DATABASE_PASSWORD；
      # 未显式设置时，默认复用 POSTGRES_PASSWORD。
      PGPASSWORD: ${POSTGRES_PASSWORD:-aiclub123}
      HINDSIGHT_API_VECTOR_EXTENSION: ${HINDSIGHT_API_VECTOR_EXTENSION:-pgvectorscale}
      # 在 bridge 网络内固定监听容器端口，避免服务只绑定到容器回环地址导致 Assistant 无法访问。
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_DASHBOARD_HOST: 0.0.0.0
      HINDSIGHT_DASHBOARD_PORT: 9999
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - "${HINDSIGHT_PORT:-18888}:8888"
      - "${HINDSIGHT_CONSOLE_PORT:-19999}:9999"

  woodpecker-server:
    profiles:
      - woodpecker
    image: ${WOODPECKER_IMAGE:-woodpeckerci/woodpecker-server:v3}
    container_name: git-ai-club-server-woodpecker-server
    restart: unless-stopped
    env_file:
      - path: ${WOODPECKER_FORGE_ENV_FILE:-/data/git-ai-club/woodpecker/forge.env}
        required: false
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      WOODPECKER_LOG_LEVEL: ${WOODPECKER_LOG_LEVEL:-info}
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://localhost:18000}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-change-me-woodpecker-agent-secret}
    ports:
      - "${WOODPECKER_PORT:-18000}:8000"
    volumes:
      - "${WOODPECKER_DATA_DIR:-/data/git-ai-club/woodpecker}:/var/lib/woodpecker/"

  woodpecker-agent:
    profiles:
      - woodpecker
    image: ${WOODPECKER_AGENT_IMAGE:-woodpeckerci/woodpecker-agent:v3}
    container_name: git-ai-club-server-woodpecker-agent
    restart: unless-stopped
    command: agent
    depends_on:
      woodpecker-server:
        condition: service_started
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-change-me-woodpecker-agent-secret}
    volumes:
      - "${WOODPECKER_AGENT_DATA_DIR:-/data/git-ai-club/woodpecker-agent}:/etc/woodpecker"
      - /var/run/docker.sock:/var/run/docker.sock

  code-processing:
    build:
      context: ./code-processing
      dockerfile: Dockerfile
      args:
        GITNEXUS_CLI_IMAGE: ${GITNEXUS_CLI_IMAGE:-ghcr.io/abhigyanpatwari/gitnexus:latest}
    image: ${CODE_PROCESSING_IMAGE:-git-ai-club-code-processing:latest}
    container_name: git-ai-club-server-code-processing
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      # 服务端部署中 code-processing 与 backend 同处 Compose 网络，固定走容器服务名。
      PLATFORM_BACKEND_INTERNAL_BASE_URL: http://backend:8080
      PLATFORM_INTERNAL_SERVICE_TOKEN: ${PLATFORM_INTERNAL_SERVICE_TOKEN:-git-ai-club-internal-service-token}
      PLATFORM_ASSISTANT_MCP_SHARED_TOKEN: ${PLATFORM_ASSISTANT_MCP_SHARED_TOKEN:-git-ai-club-assistant-mcp-token}
      PLATFORM_MINIO_ENDPOINT: ${PLATFORM_MINIO_ENDPOINT:-http://minio:9000}
      PLATFORM_MINIO_ACCESS_KEY: ${PLATFORM_MINIO_ACCESS_KEY:-minioadmin}
      PLATFORM_MINIO_SECRET_KEY: ${PLATFORM_MINIO_SECRET_KEY:-minioadmin}
      PLATFORM_MINIO_BUCKET: ${PLATFORM_MINIO_BUCKET:-ai-club-assets}
      PLATFORM_SCAN_WORKSPACE_ROOT: ${PLATFORM_SCAN_WORKSPACE_ROOT:-/tmp/git-ai-club-scans}
      PLATFORM_GITNEXUS_CLI_PATH: ${PLATFORM_GITNEXUS_CLI_PATH:-/usr/local/bin/gitnexus}
      PLATFORM_GITNEXUS_SERVE_HOST: ${PLATFORM_GITNEXUS_SERVE_HOST:-0.0.0.0}
      PLATFORM_GITNEXUS_SERVE_PORT: ${PLATFORM_GITNEXUS_SERVE_PORT:-4747}
      PLATFORM_LIGHTRAG_ENABLED: ${PLATFORM_LIGHTRAG_ENABLED:-true}
      PLATFORM_LIGHTRAG_NEO4J_URI: ${PLATFORM_LIGHTRAG_NEO4J_URI:-bolt://neo4j:7687}
      PLATFORM_LIGHTRAG_NEO4J_USER: ${PLATFORM_LIGHTRAG_NEO4J_USER:-neo4j}
      PLATFORM_LIGHTRAG_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      PLATFORM_LIGHTRAG_QDRANT_URL: ${PLATFORM_LIGHTRAG_QDRANT_URL:-http://qdrant:6333}
      PLATFORM_LIGHTRAG_PG_KV_DSN: postgresql://${POSTGRES_USER:-aiclub}:${POSTGRES_PASSWORD:-aiclub123}@postgres:5432/${POSTGRES_DB:-ai_agent_platform}
      PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_BASE_URL: ${PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_BASE_URL:-}
      PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_API_KEY: ${PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_API_KEY:-}
      PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_MODEL_NAME: ${PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_MODEL_NAME:-}
      PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_PROVIDER: ${PLATFORM_WIKI_KNOWLEDGE_EMBEDDING_PROVIDER:-OPENAI}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${CODE_PROCESSING_PORT:-9000}:9000"
      - "${PLATFORM_GITNEXUS_SERVE_PUBLIC_PORT:-4747}:${PLATFORM_GITNEXUS_SERVE_PORT:-4747}"
    volumes:
      - "${PLATFORM_SCAN_HOST_PATH:-./.data/scans}:${PLATFORM_SCAN_WORKSPACE_ROOT:-/tmp/git-ai-club-scans}"

  pi-runtime:
    build:
      context: .
      dockerfile: pi-runtime/Dockerfile
    image: ${PI_RUNTIME_IMAGE:-git-ai-club-pi-runtime:latest}
    container_name: git-ai-club-server-pi-runtime
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9010/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      PI_RUNTIME_PORT: 9010
      PI_RUNTIME_SERVICE_TOKEN: ${PLATFORM_INTERNAL_SERVICE_TOKEN:-git-ai-club-internal-service-token}
      PI_RUNTIME_BACKEND_BASE_URL: http://backend:8080
      PI_RUNTIME_MODEL_PROVIDER: ${PLATFORM_PI_RUNTIME_MODEL_PROVIDER:-}
      PI_RUNTIME_MODEL_ID: ${PLATFORM_PI_RUNTIME_MODEL_ID:-}
      PI_RUNTIME_MODEL_BASE_URL: ${PLATFORM_PI_RUNTIME_MODEL_BASE_URL:-}
      PI_RUNTIME_API_KEY: ${PLATFORM_PI_RUNTIME_API_KEY:-}
      PI_RUNTIME_THINKING_LEVEL: ${PLATFORM_PI_RUNTIME_THINKING_LEVEL:-medium}
      PI_RUNTIME_REDIS_URL: ${PI_RUNTIME_REDIS_URL:-redis://redis:6379/0}
      PI_RUNTIME_SESSION_TTL_MS: ${PI_RUNTIME_SESSION_TTL_MS:-86400000}
    ports:
      - "${PI_RUNTIME_PORT:-9010}:9010"

  gitnexus-web:
    build:
      context: ./docker/gitnexus-web
      args:
        GITNEXUS_WEB_BASE_IMAGE: ${GITNEXUS_WEB_BASE_IMAGE:-ghcr.io/abhigyanpatwari/gitnexus-web:latest}
    image: ${GITNEXUS_WEB_IMAGE:-git-ai-club-gitnexus-web:latest}
    container_name: git-ai-club-server-gitnexus-web
    restart: unless-stopped
    environment:
      # GitNexus Nexus AI 只读取专用 GITNEXUS_AI_* 配置，不再依赖平台助手运行时。
      GITNEXUS_AI_AUTO_CONFIG_ENABLED: ${GITNEXUS_AI_AUTO_CONFIG_ENABLED:-true}
      GITNEXUS_AI_PROXY_ENABLED: ${GITNEXUS_AI_PROXY_ENABLED:-true}
      GITNEXUS_AI_FORCE_CHINESE: ${GITNEXUS_AI_FORCE_CHINESE:-true}
      GITNEXUS_AI_SYSTEM_PROMPT: ${GITNEXUS_AI_SYSTEM_PROMPT:-}
      GITNEXUS_AI_FORCE_CONFIG: ${GITNEXUS_AI_FORCE_CONFIG:-false}
      GITNEXUS_AI_PROVIDER: ${GITNEXUS_AI_PROVIDER:-}
      GITNEXUS_AI_BASE_URL: ${GITNEXUS_AI_BASE_URL:-}
      GITNEXUS_AI_API_KEY: ${GITNEXUS_AI_API_KEY:-}
      GITNEXUS_AI_MODEL: ${GITNEXUS_AI_MODEL:-}
      GITNEXUS_AI_TEMPERATURE: ${GITNEXUS_AI_TEMPERATURE:-0.1}
      GITNEXUS_AI_MAX_TOKENS: ${GITNEXUS_AI_MAX_TOKENS:-}
      GITNEXUS_AI_AZURE_ENDPOINT: ${GITNEXUS_AI_AZURE_ENDPOINT:-}
      GITNEXUS_AI_AZURE_DEPLOYMENT: ${GITNEXUS_AI_AZURE_DEPLOYMENT:-}
      GITNEXUS_AI_AZURE_API_VERSION: ${GITNEXUS_AI_AZURE_API_VERSION:-}
    # 只托管 GitNexus Web UI；图谱后端仍由 code-processing 按需启动 gitnexus serve。
    ports:
      - "${PLATFORM_GITNEXUS_UI_PUBLIC_PORT:-5174}:4173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-git-ai-club-backend:latest}
    container_name: git-ai-club-server-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      code-processing:
        condition: service_started
      pi-runtime:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_agent_platform}
      DB_USERNAME: ${POSTGRES_USER:-aiclub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aiclub123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-aiclub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aiclub123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      PLATFORM_CHAT_AGENT_QUEUE_CONCURRENCY: ${PLATFORM_CHAT_AGENT_QUEUE_CONCURRENCY:-2}
      PLATFORM_EXECUTION_WORKSPACE_CLEANUP_SCHEDULER_ENABLED: ${PLATFORM_EXECUTION_WORKSPACE_CLEANUP_SCHEDULER_ENABLED:-true}
      PLATFORM_EXECUTION_WORKSPACE_CLEANUP_RETENTION_HOURS: ${PLATFORM_EXECUTION_WORKSPACE_CLEANUP_RETENTION_HOURS:-24}
      PLATFORM_EXECUTION_WORKSPACE_CLEANUP_BATCH_SIZE: ${PLATFORM_EXECUTION_WORKSPACE_CLEANUP_BATCH_SIZE:-20}
      PLATFORM_EXECUTION_WORKSPACE_CLEANUP_CLEANUP_FIXED_DELAY_MS: ${PLATFORM_EXECUTION_WORKSPACE_CLEANUP_CLEANUP_FIXED_DELAY_MS:-300000}
      # backend 调用 code-processing 走容器内服务名，避免被 MCP Host 校验或宿主机防火墙拦截。
      # 设备授权校验页域名；未显式配置时默认指向公众前端 9138，避免回退成 localhost:3000。
      PLATFORM_GITPILOT_CLI_PUBLIC_BASE_URL: ${PLATFORM_GITPILOT_CLI_PUBLIC_BASE_URL:-http://192.168.111.74:9138}
      PLATFORM_CODE_PROCESSING_BASE_URL: http://code-processing:9000
      PLATFORM_PI_RUNTIME_BASE_URL: http://pi-runtime:9010
      PLATFORM_PI_RUNTIME_SERVICE_TOKEN: ${PLATFORM_INTERNAL_SERVICE_TOKEN:-git-ai-club-internal-service-token}
      PLATFORM_ASSISTANT_BASE_URL: ${PLATFORM_ASSISTANT_BASE_URL:-http://pi-runtime:9010}
      PLATFORM_ASSISTANT_API_KEY: ${PLATFORM_ASSISTANT_API_KEY:-}
      PLATFORM_ASSISTANT_MODEL: ${PLATFORM_ASSISTANT_MODEL:-PI_RUNTIME}
      PLATFORM_ASSISTANT_TIMEOUT_SECONDS: ${PLATFORM_ASSISTANT_TIMEOUT_SECONDS:-180}
      PLATFORM_ASSISTANT_SESSION_PREFIX: ${PLATFORM_ASSISTANT_SESSION_PREFIX:-ai-club:assistant}
      PLATFORM_ASSISTANT_MAX_CONTEXT_MESSAGES: ${PLATFORM_ASSISTANT_MAX_CONTEXT_MESSAGES:-6}
      PLATFORM_ASSISTANT_GROUNDING_TTL_SECONDS: ${PLATFORM_ASSISTANT_GROUNDING_TTL_SECONDS:-86400}
      # backend 访问 Hindsight HTTP 接口与库内回退时，都固定走 docker bridge 内地址。
