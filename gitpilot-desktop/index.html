<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitPilot</title>
    <style>
      /* React 与样式包加载前的原生启动屏，避免 Tauri WebView 默认白底闪现。 */
      :root { color-scheme: dark; background: #0b0d12; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #0b0d12; }
      .boot-screen {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 18px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 43%, rgba(59, 130, 246, 0.16), transparent 28%),
          #0b0d12;
        color: #e6e9ef;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .boot-mark {
        display: grid;
        grid-template-columns: repeat(3, 7px);
        gap: 5px;
        align-items: end;
        height: 28px;
      }
      .boot-mark i {
        display: block;
        width: 7px;
        height: 13px;
        border-radius: 7px;
        background: #60a5fa;
        animation: boot-pulse 900ms ease-in-out infinite;
      }
      .boot-mark i:nth-child(2) { height: 22px; animation-delay: 120ms; }
      .boot-mark i:nth-child(3) { height: 17px; animation-delay: 240ms; }
      .boot-copy { display: grid; gap: 5px; text-align: center; }
      .boot-copy strong { font-size: 15px; font-weight: 600; letter-spacing: 0.03em; }
      .boot-copy span { color: #a7adba; font-size: 12px; }
      .boot-line { width: 116px; height: 2px; overflow: hidden; border-radius: 999px; background: #232834; }
      .boot-line::after { display: block; width: 44%; height: 100%; border-radius: inherit; background: #3b82f6; content: ""; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.35; transform: translateY(-3px); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark i, .boot-line::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite" aria-label="正在启动 GitPilot">
        <div class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="boot-copy">
          <strong>GitPilot</strong>
          <span>正在启动本地 Coding Agent…</span>
        </div>
        <div class="boot-line" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
