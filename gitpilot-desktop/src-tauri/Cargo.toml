[package]
name = "gitpilot-desktop"
version = "0.1.0"
description = "GitPilot 桌面版 - Tauri 2 原生 GUI，复用 gitpilot-cli RPC 核心"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认包含自定义协议
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
